name: Build Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/app.spec --noconfirm

      - name: Zip build output
        run: Compress-Archive -Path dist/STLColorSplitter/* -DestinationPath STLColorSplitter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: STLColorSplitter-windows
          path: STLColorSplitter-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: STLColorSplitter-windows.zip
